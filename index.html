<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">Calculator</div>
    <div id="container">
        <table>
            <tr>
                <td colspan="4">
                    <input type="text" id="input-display" value="0" \required>
                </td>
            </tr>
            <tr class="first-row">
                <td>
                    <button class="calc-btn calc-func" name="clear">AC</button>
                </td>
                <td>
                    <button class="calc-btn calc-func" name="erase">&#9003;</button>
                </td>
                <td>
                    <button class="calc-btn calc-op" value="%">%</button>
                </td>
                <td>
                    <button class="calc-btn calc-op" name="division" value="/">&divide;</button>
                </td>
            </tr>
            <tr class="second-row">
                <td>
                    <button class="calc-btn calc-num" value="7">7</button>
                </td>
                <td>
                    <button class="calc-btn calc-num" value="8">8</button>
                </td>
                <td>
                    <button class="calc-btn calc-num" value="9">9</button>
                </td>
                <td>
                    <button class="calc-btn calc-op" value="*">&times;</button>
                </td>
            </tr>
            <tr class="third-row">
                <td>
                    <button class="calc-btn calc-num" value="4">4</button>
                </td>
                <td>
                    <button class="calc-btn calc-num" value="5">5</button>
                </td>
                <td>
                    <button class="calc-btn calc-num" value="6">6</button>
                </td>
                <td>
                    <button class="calc-btn calc-op" value="-">&minus;</button>
                </td>
            </tr>
            <tr class="fourth-row">
                <td>
                    <button class="calc-btn calc-num" value="1">1</button>
                </td>
                <td>
                    <button class="calc-btn calc-num" value="2">2</button>
                </td>
                <td>
                    <button class="calc-btn calc-num" value="3">3</button>
                </td>
                <td>
                    <button class="calc-btn calc-op" value="+">+</button>
                </td>
            </tr>
            <tr class="fifth-row">
                <td>
                    <button class="calc-btn calc-num" value="0">0</button>
                </td>
                <td>
                    <button class="calc-btn calc-num" value=".">.</button>
                </td>
                <td>
                    <button class="calc-btn calc-op" value="-">+/&minus;</button>
                </td>
                <td>
                    <button class="calc-btn calc-equal" name="equal">=</button>
                </td>
            </tr>
            <tr class="sixth-row">
                <td>
                    <button class="calc-btn calc-op" value="^">x<sup>y</sup></button>
                </td>
                <td>
                    <button class="calc-btn calc-op" value="sqrt">&Sqrt;x</button>
                </td>
                <td>
                    <button class="calc-btn calc-op" value="(">(</button>
                </td>
                <td>
                    <button class="calc-btn calc-op" value=")">)</button>
                </td>
            </tr>
        </table>
        <div id="footer">powered by &copy; Natalia Lee</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
